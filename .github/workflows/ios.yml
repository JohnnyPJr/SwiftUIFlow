name: SwiftUIFlow CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  macos-test:
    name: Lint, Build, and Test (macOS, Xcode 16.4)
    runs-on: macos-15

    steps:
      # 1️⃣ Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Clear Derived Data for clean builds
      - name: Clear Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      # 3️⃣ Ensure SwiftLint and SwiftFormat
      - name: Ensure SwiftLint and SwiftFormat
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          if ! command -v swiftformat >/dev/null 2>&1; then
            brew install swiftformat
          fi

          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

          swiftformat --version
          swiftlint version

      # 4️⃣ Run SwiftFormat in lint mode
      - name: Run SwiftFormat (Lint Only)
        run: |
          set -eo pipefail
          swiftformat . --lint

      # 5️⃣ Run SwiftLint
      - name: Run SwiftLint
        run: |
          set -eo pipefail
          swiftlint lint --config swiftlint.yml --reporter github-actions-logging

      # 6️⃣ Setup Xcode 16.4
      - name: Setup Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      # 7️⃣ Install xcpretty for nice log output
      - name: Install xcpretty
        run: gem install xcpretty

      # 8️⃣ Build & Test the SwiftUIFlow scheme (macOS)
      - name: Clean & Test SwiftUIFlow
        run: |
          set -eo pipefail
          scheme="SwiftUIFlow"

          # Apply signing overrides only on CI
          if [ -n "$GITHUB_ACTIONS" ]; then
            echo "Running on CI, disabling code signing..."
            xcodebuild clean test \
              -scheme "$scheme" \
              -destination "platform=macOS" \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              | xcpretty
          else
            echo "Running locally, keeping signing settings..."
            xcodebuild clean test \
              -scheme "$scheme" \
              -destination "platform=macOS" \
              | xcpretty
          fi

      # 9️⃣ Save test logs as an artifact (optional)
      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: ~/Library/Logs/Test
